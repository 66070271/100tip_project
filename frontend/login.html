<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 100TIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#FAFAFA] text-gray-900 antialiased flex flex-col min-h-screen">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tighter text-black">100TIP.</a>
            <div class="flex items-center space-x-6 text-sm font-medium">
                <a href="index.html" class="text-gray-500 hover:text-black transition-colors">Feed</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center px-6">
        <div class="w-full max-w-md bg-white p-8 rounded-xl border border-gray-200 shadow-sm">
            <h1 class="text-2xl font-bold text-black tracking-tight mb-6">Welcome to 100TIP</h1>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                
                <div id="message" class="text-sm font-medium text-center hidden"></div>

                <div class="flex space-x-3 pt-4">
                    <button onclick="handleAuth('login')" class="flex-1 bg-black text-white py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">Login</button>
                    <button onclick="handleAuth('register')" class="flex-1 bg-white text-black border border-gray-300 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors">Register</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const AUTH_API = "http://localhost:8000/api/auth"; 

        async function handleAuth(action) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const msgDiv = document.getElementById('message');

            if (!username || !password) {
                showMessage("Please fill in both fields.", "text-red-600");
                return;
            }

            try {
                const res = await fetch(`${AUTH_API}/${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (res.ok) {
                    if (action === 'register') {
                        showMessage("Registered successfully! Now click Login.", "text-green-600");
                    } else {
                        
                        localStorage.setItem('100tip_token', data.token);
                        showMessage("Logged in! Redirecting...", "text-green-600");
                        setTimeout(() => window.location.href = 'index.html', 1000);
                    }
                } else {
                    showMessage(data.error || "An error occurred", "text-red-600");
                }
            } catch (err) {
                showMessage("Connection error. Is the Auth service running?", "text-red-600");
            }
        }

        function showMessage(text, colorClass) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = `text-sm font-medium text-center mt-2 ${colorClass} block`;
        }
    </script>
</body>
</html>
