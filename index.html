<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100TIP - Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#FAFAFA] text-gray-900 antialiased">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold tracking-tighter text-black">100TIP.</a>
            <div class="flex items-center space-x-6 text-sm font-medium">
                <a href="index.html" class="text-black border-b-2 border-black pb-1">Feed</a>
                <a href="admin.html" class="text-gray-500 hover:text-black transition-colors">Admin</a>
                <a href="create.html" class="bg-black text-white px-4 py-2 rounded-full hover:bg-gray-800 transition-colors">Write</a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-12">
        <div id="feed-container" class="space-y-8 border-l border-gray-200 pl-6">
            <p class="text-gray-400 text-sm animate-pulse">Loading stories...</p>
        </div>
    </main>

    <script>
        const API = "http://localhost:8080/api/posts";

        window.onload = async () => {
            try {
                const res = await fetch(API + "?t=" + new Date().getTime());
                const posts = await res.json();
                
                // กรองเฉพาะ approved และเรียงจากใหม่ไปเก่า
                const approvedPosts = posts.filter(p => p.status === 'approved').sort((a, b) => b.ID - a.ID);
                const container = document.getElementById('feed-container');

                if (approvedPosts.length === 0) {
                    container.innerHTML = `<p class="text-gray-400 italic">No stories published yet.</p>`;
                    return;
                }

                container.innerHTML = approvedPosts.map(p => {
                    const date = new Date(p.CreatedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    
                    return `
                    <article onclick="window.location.href='post.html?id=${p.ID}'" class="group bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-all cursor-pointer">
                        <div class="text-xs text-gray-500 tracking-wide uppercase font-semibold mb-3">
                            By ${p.user_id} <span class="mx-1">·</span> ${date}
                        </div>
                        <h2 class="text-2xl font-bold text-gray-900 mb-2 tracking-tight group-hover:underline decoration-2 decoration-gray-300">${p.title}</h2>
                        <p class="text-gray-500 line-clamp-2 font-light text-sm leading-relaxed">${p.content}</p>
                    </article>
                    `;
                }).join('');
            } catch (err) {
                document.getElementById('feed-container').innerHTML = `<p class="text-red-500">Connection error. Is Docker running?</p>`;
            }
        };
    </script>
</body>
</html>
