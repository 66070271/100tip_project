events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8000;

        # 📍 1. ส่วนเสิร์ฟไฟล์หน้าเว็บ (เอาไว้บนสุดเพื่อความชัวร์)
        location / {
            root /usr/share/nginx/html;
            index login.html;
            try_files $uri $uri/ /login.html;
        }

        # 📍 2. API สำหรับ Auth (ใช้ทางนี้ทางเดียวเท่านั้น!)
        location /api/auth/ {
            proxy_pass http://authentication-service:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 📍 3. API สำหรับ Discussion
        location /api/posts {
            proxy_pass http://discussion-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 📍 4. API สำหรับ Moderation
        location /api/tasks {
            proxy_pass http://moderation-service:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ❌ ห้ามมี location /login หรือ location /register แยกออกมาเด็ดขาด!
    }
}